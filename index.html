<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundamentals Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="preload" href="font/HappyChicken.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header>
    <h1>Clics Color Assistent</h1>
    <p>AI-Powered Colour Recognition for Colour-Blind Children</p>
  </header>

  <main>
    <!-- Camera / input feed -->
    <section id="input-section">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="output-canvas"></canvas>
    </section>

    <!-- Prediction / result display -->
    <section id="result-section">
      <div id="label-container"></div>
    </section>

    <button id="start-btn">Start</button>
  </main>

  <footer>
    <p>Built for the Technology-Driven Design module, University of Antwerp.</p>
  </footer>

  <!-- Teachable Machine library (remove if using Roboflow) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <script src="script.js"></script>
</body>

</html>
